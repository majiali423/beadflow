[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beadflow-cv-service"
version = "0.1.0"
description = "Controlled computer-vision service for BeadFlow"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "opencv-contrib-python-headless>=4.11,<5",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "rapidocr-onnxruntime>=1.4,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
